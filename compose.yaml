services:
  simulator:
    image: camera-logic-simulator:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - ./configs:/app/configs:ro
      - ./logic_versions:/app/logic_versions:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./runs:/app/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "--config", "configs/host-cpu.yaml"]
